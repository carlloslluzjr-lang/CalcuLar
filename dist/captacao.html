<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101e35">
<title>Fale com a equipe | CalcuLar</title>
<link rel="icon" href="./calcular-mark.svg" type="image/svg+xml">
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18243a;background:#f4f7fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#fff;border:1px solid #e2e8ef;border-radius:20px;padding:clamp(22px,6vw,42px);box-shadow:0 20px 60px #10233d12}.brand{display:flex;align-items:center;gap:10px;color:#101e35;font-weight:800;font-size:20px}.brand img{width:38px;height:38px}.brand span{color:#1468d4}h1{font-size:clamp(24px,5vw,32px);letter-spacing:-.04em;margin:28px 0 8px}p{color:#68768a;line-height:1.55}.field{margin:18px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input{width:100%;height:48px;border:1px solid #d8e0e8;border-radius:10px;padding:0 13px;font:inherit}.consent{display:flex;gap:10px;align-items:flex-start;color:#526071;font-size:13px;line-height:1.45;margin:18px 0}.consent input{margin-top:3px}.button{width:100%;height:50px;border:0;border-radius:11px;background:#1468d4;color:white;font-weight:800;font-size:15px;cursor:pointer}.button:disabled{opacity:.6;cursor:wait}.message{padding:13px;border-radius:10px;background:#f1f6fb;color:#53647b;margin-top:15px}.message.hidden{display:none}.message.error{background:#fff0f0;color:#9f3030}.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}.foot{font-size:12px;margin-top:22px;color:#8490a0}
</style>
</head>
<body><main class="card"><div class="brand"><img src="./calcular-mark.svg" alt=""><div>Calcu<span>Lar</span></div></div><h1>Vamos conversar sobre seu imóvel?</h1><p>Deixe seus dados. A equipe responsável entrará em contato para entender o que você procura.</p>
<form id="leadForm"><div class="field"><label for="name">Nome</label><input id="name" name="name" maxlength="120" autocomplete="name" required></div><div class="field"><label for="phone">Telefone ou WhatsApp</label><input id="phone" name="phone" autocomplete="tel" inputmode="tel" maxlength="30"></div><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" maxlength="160"></div><label class="consent"><input id="consent" type="checkbox" required><span>Autorizo esta empresa a usar os dados informados para responder a este contato. Consulte o aviso de privacidade da empresa.</span></label><label class="hp" aria-hidden="true">Não preencha<input id="website" tabindex="-1" autocomplete="off"></label><button class="button" id="submit" type="submit">Enviar meus dados</button><div id="message" class="message hidden" role="status"></div></form>
<div class="foot">Seus dados serão enviados somente à empresa responsável por este formulário.</div></main>
<script src="./supabase-config.js"></script><script>
const cfg=window.CALCULAR_SUPABASE||{};const msg=document.querySelector('#message');function showMessage(t,error=false){msg.textContent=t;msg.className='message'+(error?' error':'')+' visible'}
document.querySelector('#leadForm').addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('#submit');const token=new URLSearchParams(location.search).get('token');if(!cfg.url||!cfg.key){showMessage('O formulário ainda não foi conectado ao CalcuLar. Avise a equipe responsável.',true);return}if(!token){showMessage('Link de formulário inválido.',true);return}const payload={p_token:token,p_name:document.querySelector('#name').value.trim(),p_email:document.querySelector('#email').value.trim(),p_phone:document.querySelector('#phone').value.trim(),p_consent:document.querySelector('#consent').checked,p_website:document.querySelector('#website').value};button.disabled=true;button.textContent='Enviando…';try{const r=await fetch(cfg.url.replace(/\/$/, '')+'/rest/v1/rpc/submit_public_lead',{method:'POST',headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error('Não foi possível enviar. Confira os dados e tente novamente.');document.querySelector('#leadForm').reset();showMessage('Recebemos seus dados. A equipe entrará em contato.')}catch(err){showMessage(err.message,true)}finally{button.disabled=false;button.textContent='Enviar meus dados'}});
</script></body></html>
